syntax = "proto3";

option csharp_namespace = "Cna.Intelligence.Contracts.V1";

package sandtable.intelligence.v1;

service IntelligenceService {
  rpc ChoosePlan(DecisionRequest) returns (DecisionResponse);
  rpc GenerateNarrative(NarrativeRequest) returns (stream NarrativeChunk);
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
}

message DecisionRequest {
  string decision_id = 1;
  string game_id = 2;
  int64 state_version = 3;
  string ruleset_hash = 4;
  CommanderProfile commander = 5;
  StrategicObservation observation = 6;
  repeated PlanCandidate candidates = 7;
}

message CommanderProfile {
  string commander_id = 1;
  string persona_version = 2;
  repeated string traits = 3;
}

message StrategicObservation {
  repeated string relevant_facts = 1;
  repeated string recent_events = 2;
}

message PlanCandidate {
  string plan_id = 1;
  string plan_type = 2;
  double objective_score = 3;
  double supply_risk = 4;
  double casualty_risk = 5;
  double expected_value = 6;
  repeated string relevant_facts = 7;
}

message DecisionResponse {
  string decision_id = 1;
  int64 based_on_state_version = 2;
  string selected_plan_id = 3;
  map<string, string> parameters = 4;
  string commander_commentary = 5;
  ModelTrace trace = 6;
  string ruleset_hash = 7;
}

message ModelTrace {
  string provider = 1;
  string model = 2;
  string prompt_template_version = 3;
  string persona_version = 4;
  int64 latency_ms = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
  string fallback_reason = 8;
  string response_hash = 9;
}

message NarrativeRequest {
  string game_id = 1;
  int64 state_version = 2;
  repeated string event_summaries = 3;
}

message NarrativeChunk {
  string text = 1;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  bool decision_provider_available = 1;
  bool narrative_provider_available = 2;
  repeated string providers = 3;
}
