name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A merged PR's ref becomes main; its number stays stable. Scheduled full
  # runs have a separate group so main-push bursts cannot cancel them.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  # The p01-* proof families (and their proof-source-SHA handling) moved to
  # .github/workflows/ci-nightly-heavy.yml (schedule-only); nothing in this
  # file needs P01_PROOF_SOURCE_SHA any more. orleans runs here again (Phase D
  # of #439) and also stays in the nightly file.

jobs:
  # Scope gate (site-overhaul Phase 0.2). A workflow skipped wholesale by `paths-ignore`
  # never reports its check names, so with required status checks a site-only PR would
  # wait forever on "Expected". Instead this workflow always starts, and this cheap job
  # decides whether the heavy .NET jobs run. Heavy jobs skip via job-level `if:`;
  # `verify` still runs (always()) and still fails if anything failed.
  # Narrow PRs touch only independently checked paths or are documentation-only.
  # Push, schedule, manual dispatch, empty diffs and all other PR paths: heavy=true.
  # Do not filter PR events at workflow level: close must always cancel prior runs.
  changes:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - name: Check out tested event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          heavy=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --no-renames --name-only "$BASE_SHA" HEAD > changed-files.txt
            echo "Changed files:"; cat changed-files.txt
            if [ -s changed-files.txt ] && {
              ! grep -Eqv '^(site/|src/Cna\.Maproom/|tools/|deploy/)' changed-files.txt ||
              ! grep -Eqv '(^docs/|\.md$)' changed-files.txt
            }; then
              heavy=false
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy"

  format:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Skip formatting for narrow scope
        if: ${{ needs.changes.outputs.heavy == 'false' }}
        run: echo "No .NET formatting required for this PR."
      - name: Check out tested event SHA
        if: ${{ needs.changes.outputs.heavy == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up .NET
        if: ${{ needs.changes.outputs.heavy == 'true' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        if: ${{ needs.changes.outputs.heavy == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'NuGet.Config') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Create formatting evidence directory
        if: ${{ needs.changes.outputs.heavy == 'true' }}
        run: mkdir -p artifacts/format
      - name: Restore for required formatting
        if: ${{ needs.changes.outputs.heavy == 'true' }}
        run: dotnet restore Sandtable.slnx '/bl:artifacts/format/restore-{}.binlog'
      - name: Verify formatting
        if: ${{ needs.changes.outputs.heavy == 'true' }}
        run: dotnet format Sandtable.slnx --verify-no-changes --no-restore
      - name: Retain formatting evidence
        if: ${{ always() && needs.changes.outputs.heavy == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: format-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/format
          if-no-files-found: error
          retention-days: 14

  # Architecture fitness functions (docs/work/plans/2026-11-23-codebase-overhaul-direction.md,
  # Section 5). Deliberately NOT added to `verify`'s needs list yet -- this is a brand-new
  # project landing the same day as active feature work elsewhere in the repo, so it runs
  # and reports as its own check first. Promote it to a required dependency of `verify`
  # once it has run clean in CI for a while.
  architecture-tests:
    needs: [changes, prepare]
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Must match `prepare`'s NUGET_PACKAGES so the shared build-output artifact's
      # obj/ restore assets (which reference packages by this path) resolve here too --
      # a fresh runner's default ~/.nuget/packages is otherwise empty, and MSBuild needs
      # package-provided targets/props at evaluation time even with --no-build --no-restore
      # (confirmed locally: without this, `dotnet test --no-build --no-restore` fails with
      # "No test projects were found" even though artifacts/bin and artifacts/obj are present).
      NUGET_PACKAGES: ${{ github.workspace }}/nuget_packages
    steps:
      - name: Check out tested event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Download shared solution build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-output-${{ github.sha }}-${{ github.run_attempt }}
          path: .
      - name: Restore executable bit lost in the artifact round-trip
        # actions/upload-artifact and download-artifact zip the content in transit
        # and don't preserve the Unix execute bit, so the MTP native apphost
        # (invoked directly, not via `dotnet exec <dll>`) comes back non-executable
        # (confirmed against a real run: Win32Exception 13 "Permission denied"
        # starting .../artifacts/bin/Cna.ArchitectureTests/release/Cna.ArchitectureTests).
        run: chmod -R +x artifacts/bin
      - name: Run architecture fitness tests
        run: dotnet test --project tests/Cna.ArchitectureTests/Cna.ArchitectureTests.csproj --configuration Release --no-build --no-restore --report-xunit-xml --report-junit --report-junit-filename results.junit.xml --results-directory artifacts/architecture-tests
      - name: Upload Test Results to Trunk.io
        if: ${{ !cancelled() }}  # Upload the results even if the tests fail
        continue-on-error: true  # don't fail this job if the upload fails
        uses: trunk-io/analytics-uploader@6bc623e3c4b7a80d7a35badde2a8e8be1e78605d # v3
        with:
          junit-paths: artifacts/architecture-tests/*.junit.xml
          org-slug: ${{ vars.TRUNK_ORG_URL_SLUG }}
          test-collection-id: ${{ vars.TRUNK_TEST_COLLECTION_ID }}
          token: ${{ secrets.TRUNK_API_KEY }}
      - name: Retain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: architecture-tests-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/architecture-tests
          if-no-files-found: error
          retention-days: 14

  prepare:
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Redirect the global NuGet package cache into the workspace so it can be
      # shipped to downstream jobs alongside the compiled build output -- see the
      # matching comment on architecture-tests/tests/orleans's NUGET_PACKAGES.
      NUGET_PACKAGES: ${{ github.workspace }}/nuget_packages
    outputs:
      shards: ${{ steps.scope.outputs.shards }}
      excluded_shards: ${{ steps.scope.outputs.excluded_shards }}
    steps:
      - name: Check out tested event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        # Points at nuget_packages (NUGET_PACKAGES above), not the default
        # ~/.nuget/packages, so this doubles as this run's within-run share with
        # architecture-tests/tests/orleans (via the build-output artifact below)
        # as well as the usual cross-run cache warmth.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nuget_packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'NuGet.Config') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Report selected SDK
        run: dotnet --version
      - name: Determine per-trigger shard scope
        id: scope
        # pull_request: fast path (fast-*/r02-*/exercise/contracts only).
        # push, schedule and manual dispatch: full suite, nothing excluded.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo 'shards=["r02-1","r02-2","r02-3","fast-01","fast-02","fast-03","fast-04","exercise","contracts"]'
              echo 'excluded_shards=long-01,long-02,long-03,long-04,long-05,long-06,long-07,long-08'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'shards=["long-01","long-02","long-03","long-04","long-05","long-06","long-07","long-08","r02-1","r02-2","r02-3","fast-01","fast-02","fast-03","fast-04","exercise","contracts"]'
              echo 'excluded_shards='
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Create evidence directory
        run: mkdir -p artifacts/ci
      - name: Restore
        run: dotnet restore Sandtable.slnx '/bl:artifacts/ci/restore-{}.binlog'
      - name: Build
        run: dotnet build Sandtable.slnx --configuration Release --no-restore '/bl:artifacts/ci/build-{}.binlog'
      - name: Retain shared solution build for downstream jobs
        # Three paths on purpose, not two: with only artifacts/bin + artifacts/obj,
        # upload-artifact's "least common ancestor" root collapses to .../artifacts
        # itself, so the zip's entries come out as bin/... and obj/... -- stripped
        # of the artifacts/ prefix downstream jobs actually read from (confirmed
        # against a real run). Including nuget_packages, which lives outside
        # artifacts/, forces the ancestor up to the workspace root so artifacts/bin,
        # artifacts/obj and nuget_packages all land at their real relative paths.
        # The NuGet cache folder is deliberately NOT dot-prefixed (not .nuget_packages):
        # upload-artifact's include-hidden-files defaults to false and silently drops a
        # dotfile/dotdir root entirely -- confirmed against a real run where a
        # .nuget_packages path uploaded with byte-for-byte the same artifact size as
        # when it wasn't listed at all.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-output-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/bin
            artifacts/obj
            nuget_packages
          if-no-files-found: error
          retention-days: 1
      - name: Check fail-closed coverage helper
        run: python3 .github/scripts/test_partition_test.py
      - name: Check exhaustive R02 allocation and process supervision
        run: |
          python3 .github/scripts/r02_partition_test.py
          python3 .github/scripts/ci_group_runner_test.py
          python3 .github/scripts/long_suite_partition_test.py
          python3 .github/scripts/local_tests_test.py
          python3 .github/scripts/orleans_partition_test.py
      - name: Build Release row discovery helper
        run: dotnet build .github/scripts/ReleaseTestRows/ReleaseTestRows.csproj --configuration Release '/bl:artifacts/ci/row-helper-{}.binlog'
      - name: Discover actual Release rows and prove complementary filters
        run: python3 .github/scripts/long_suite_partition.py discover --sha "$TESTED_SHA" --attempt "$RUN_ATTEMPT"
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
      - name: Retain inventory and discovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-inventory-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 14

  tests:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # See the matching comment on architecture-tests's NUGET_PACKAGES.
      NUGET_PACKAGES: ${{ github.workspace }}/nuget_packages
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - name: Check out tested event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Create evidence directory
        run: mkdir -p artifacts/ci
      - name: Download shared solution build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-output-${{ github.sha }}-${{ github.run_attempt }}
          path: .
      - name: Restore executable bit lost in the artifact round-trip
        # See the matching comment on architecture-tests's chmod step.
        run: chmod -R +x artifacts/bin
      - name: Download current attempt Release row proof
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-inventory-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/partition-proof
      - name: Run complete-row partition
        run: python3 .github/scripts/long_suite_partition.py execute --sha "$TESTED_SHA" --attempt "$RUN_ATTEMPT" --shard "$TEST_SHARD"
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TEST_SHARD: ${{ matrix.shard }}
      - name: Upload Test Results to Trunk.io
        if: ${{ !cancelled() }}  # Upload the results even if the tests fail
        continue-on-error: true  # don't fail this job if the upload fails
        uses: trunk-io/analytics-uploader@6bc623e3c4b7a80d7a35badde2a8e8be1e78605d # v3
        with:
          junit-paths: artifacts/local-parallel-check/**/results/*.junit.xml
          org-slug: ${{ vars.TRUNK_ORG_URL_SLUG }}
          test-collection-id: ${{ vars.TRUNK_TEST_COLLECTION_ID }}
          token: ${{ secrets.TRUNK_API_KEY }}
      - name: Retain results, process status and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 14

  orleans:
    needs: [changes, prepare]
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    # Phase D of #439 (docs/work/plans/2026-11-20-phase-d-capacity-latency-benchmark.md §1):
    # Cna.OrleansHost.Tests holds every Postgres+Marten (Testcontainers) test of the durable
    # campaign journal, and since #373 it ran nightly only -- so #443-#450 merged with none of
    # it gating a PR. It gates PR/push again. Testcontainers drives the GitHub-hosted runner's own
    # Docker daemon, so no services: block is needed. Excluded rows, still run nightly:
    # the ~30m Graziani replay soak (orleans-slow.yml) and the four live recommendation-connector
    # rows (see EXCLUDED in .github/scripts/orleans_partition.py).
    #
    # The module is one ~20-minute serial class, so it is split by test method across
    # 4 parallel jobs (docs/work/2026-11-24-ci-wall-clock-measurement.md). Each shard runs its own
    # Testcontainers Postgres. orleans_partition.py proves per shard that every planned row ran and
    # passed, and the `verify` job proves all shards share one plan whose allocation is disjoint and
    # complete. Retry-once-on-no-report and the 18m per-attempt cap are preserved inside the script;
    # a failed or report-less run now exits non-zero (the old inline loop reported exit 0 after two
    # timeouts and skipped verification).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # See the matching comment on architecture-tests's NUGET_PACKAGES.
      NUGET_PACKAGES: ${{ github.workspace }}/nuget_packages
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out tested event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Download shared solution build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-output-${{ github.sha }}-${{ github.run_attempt }}
          path: .
      - name: Restore executable bit lost in the artifact round-trip
        # See the matching comment on architecture-tests's chmod step.
        run: chmod -R +x artifacts/bin
      - name: Run and verify Orleans host shard
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/orleans-results
          python3 .github/scripts/orleans_partition.py execute --shard "$ORLEANS_SHARD" --total 4 --results artifacts/orleans-results
        env:
          ORLEANS_SHARD: ${{ matrix.shard }}
      - name: Upload Test Results to Trunk.io
        # orleans_partition.py's execute still only emits --report-xunit-xml (not JUnit) per
        # shard -- same known gap as the `tests` job (see docs/runbooks/local-testing.md).
        # This step is a harmless no-op until that script also emits a .junit.xml report.
        if: ${{ !cancelled() }}  # Upload the results even if the tests fail
        continue-on-error: true  # don't fail this job if the upload fails
        uses: trunk-io/analytics-uploader@6bc623e3c4b7a80d7a35badde2a8e8be1e78605d # v3
        with:
          junit-paths: artifacts/orleans-results/*.junit.xml
          org-slug: ${{ vars.TRUNK_ORG_URL_SLUG }}
          test-collection-id: ${{ vars.TRUNK_TEST_COLLECTION_ID }}
          token: ${{ secrets.TRUNK_API_KEY }}
      - name: Retain Orleans test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orleans-${{ github.sha }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: artifacts/orleans-results
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [changes, prepare, tests, format, orleans]
    # Keep verifying completed failures, but never start or continue a proof
    # for a workflow superseded by concurrency or cancelled by the user.
    if: ${{ always() && !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retain exact dependency outcomes
        run: |
          mkdir -p artifacts/ci
          printf '%s\n' "$NEEDS_JSON" > artifacts/ci/dependencies.json
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
      - name: Require the scope gate to pass and no dependency to fail or cancel
        # Always runs. Heavy jobs may be `skipped` only when the gate decided heavy=false
        # (narrow PR); in that mode every other outcome besides success/skipped fails.
        # In heavy mode the exact-coverage steps below remain the authority (unchanged).
        run: |
          set -euo pipefail
          jq -e '.changes.result == "success"' <<<"$NEEDS_JSON" >/dev/null || { echo "scope gate did not succeed"; exit 1; }
          if [ "$HEAVY" = "false" ]; then
            jq -e '.format.result == "success"' <<<"$NEEDS_JSON" >/dev/null || { echo "format check did not succeed"; exit 1; }
            jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS_JSON" >/dev/null || { echo "a dependency failed or was cancelled"; exit 1; }
            echo "Narrow change: heavy .NET jobs skipped by design."
          elif [ "$HEAVY" != "true" ]; then
            echo "invalid scope gate output"; exit 1
          fi
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
      - name: Download inventory and all leaf reports
        if: ${{ always() && needs.changes.outputs.heavy == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ci-*-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci
          merge-multiple: true
      - name: Download Orleans shard results
        if: ${{ always() && needs.changes.outputs.heavy == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: orleans-${{ github.sha }}-${{ github.run_attempt }}-shard-*
          path: artifacts/orleans
      - name: Require every Orleans shard to cover its planned rows exactly
        if: ${{ always() && needs.changes.outputs.heavy == 'true' }}
        run: python3 .github/scripts/orleans_partition.py verify --total 4 artifacts/orleans/*
      - name: Require successful processes and complete exact-head coverage
        if: ${{ always() && needs.changes.outputs.heavy == 'true' }}
        run: |
          # The verifier requires needs == {prepare,tests,format,orleans} exactly; drop the gate.
          NEEDS_JSON="$(jq -c 'del(.changes)' <<<"$NEEDS_JSON_ALL")"
          export NEEDS_JSON
          python3 .github/scripts/long_suite_partition.py verify --sha "$TESTED_SHA" --attempt "$RUN_ATTEMPT" --exclude-shards "$EXCLUDE_SHARDS"
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          NEEDS_JSON_ALL: ${{ toJSON(needs) }}
          EXCLUDE_SHARDS: ${{ needs.prepare.outputs.excluded_shards }}
      - name: Retain aggregate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-aggregate-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          license-check: false
