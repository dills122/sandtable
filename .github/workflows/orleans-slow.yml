name: Orleans slow replay soak

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  orleans-slow:
    runs-on: ubuntu-24.04
    # Long SQLite replay proof: 144 accepted steps and repeated full-history
    # verification, previously ~29m43s locally. Hosted runs consistently hit
    # the 40m cap; allow up to 90m with bounded progress sampling and retain
    # diagnostics even when the test itself reaches that deadline.
    timeout-minutes: 100
    steps:
      - name: Check out tested event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore and build Orleans host tests
        run: |
          dotnet restore tests/Cna.OrleansHost.Tests/Cna.OrleansHost.Tests.csproj
          dotnet build tests/Cna.OrleansHost.Tests/Cna.OrleansHost.Tests.csproj --configuration Release --no-restore
      - name: Run the excluded slow replay test
        timeout-minutes: 95
        run: python3 .github/scripts/orleans_soak.py artifacts/orleans-slow-results
      - name: Retain slow replay test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orleans-slow-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/orleans-slow-results
          if-no-files-found: error
          retention-days: 14
